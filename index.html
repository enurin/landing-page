<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="logo">Header Logo</div>

      <nav>
        <ul>
          <li><a href="#"> header link one</a></li>
          <li><a href="#"> header link two</a>"</li>
          <li><a href="#"> header link three</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="hero-text">
          <h1>This website is awesome</h1>
          <p>
            This website has some context that goes here under the main title.
            It's smaller font and color is of lower contrast.
          </p>
          <button>Sign up</button>
        </div>
      </section>

      <section class="information">
        <h2>Some random information.</h2>

        <div class="cards">
          <div class="card">
            <img src="images/example.png" alt="Describe the image" />
            <p>Caption one</p>
          </div>

          <div class="card">
            <img src="images/example2.png" alt="Description" />
            <p>Caption two</p>
          </div>

          <div class="card">
            <img src="images/example3.png" alt="Description" />
            <p>Caption three</p>
          </div>

          <div class="card">
            <img src="images/example4.png" alt="Description" />
          </div>
        </div>
      </section>

      <section class="testimonial"></section>

      <section class="call-to-action"></section>
    </main>

    <footer></footer>
  </body>
</html>
